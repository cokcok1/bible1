<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>箴言隨筆</title>
    
    <!-- PWA / 手機安裝支援設定 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2b6cb0">
    
    <!-- iOS (iPhone/iPad) 專用安裝支援 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="箴言隨筆">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
            background-color: #f0f7ff;
            color: #1a365d;
        }
        .zen-card {
            background: #ffffff;
            border: 1px solid #d0e1fd;
        }
        .paragraph-block {
            margin-bottom: 1.25rem;
            line-height: 1.8;
        }
        .paragraph-block:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-10">

    <!-- 頂部導航與選擇器 -->
    <header class="w-full bg-white shadow-sm border-b border-sky-100 sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-3.5 flex flex-col sm:flex-row items-center justify-between gap-3">
            <h1 class="text-lg sm:text-xl font-bold text-sky-900 tracking-wider">🧧 箴言隨筆</h1>
            
            <div class="flex items-center gap-2.5 w-full sm:w-auto justify-between sm:justify-end">
                <select id="verseSelect" class="bg-sky-50 border border-sky-300 text-sky-950 text-base font-semibold rounded-lg focus:ring-sky-500 focus:border-sky-500 p-2 outline-none transition flex-grow sm:w-64">
                    <option value="">載入資料庫中...</option>
                </select>

                <div class="flex items-center gap-1 bg-sky-50 border border-sky-300 rounded-lg p-1 shrink-0">
                    <span class="text-xs text-sky-800 px-1 font-bold">字體</span>
                    <button onclick="changeFontSize(-1)" class="w-7 h-7 bg-white hover:bg-sky-100 text-sky-950 rounded font-bold text-xs shadow-sm transition flex items-center justify-center" title="縮小字體">A-</button>
                    <button onclick="changeFontSize(1)" class="w-7 h-7 bg-white hover:bg-sky-100 text-sky-950 rounded font-bold text-xs shadow-sm transition flex items-center justify-center" title="放大字體">A+</button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-3xl w-full mx-auto px-4 mt-6 flex-grow">
        <div id="loadingIndicator" class="text-center py-20 text-sky-700">
            <p class="text-base animate-pulse">正在從「箴言隨筆.txt」讀取資料庫...</p>
        </div>

        <div id="contentContainer" class="hidden space-y-6">
            <div class="zen-card rounded-2xl p-6 sm:p-8 shadow-sm">
                <div class="flex items-center justify-between border-b border-sky-100 pb-4 mb-5">
                    <span id="verseTitle" class="text-xl sm:text-2xl font-bold text-sky-950 bg-sky-100/80 px-3.5 py-1.5 rounded-md tracking-wide"></span>
                    <div class="flex items-center gap-2">
                        <button id="prevBtn" onclick="changeVerse(-1)" class="px-3.5 py-1.5 text-xs sm:text-sm font-semibold text-sky-800 bg-sky-50 hover:bg-sky-100 rounded-lg transition disabled:opacity-30 disabled:cursor-not-allowed">上一段</button>
                        <button id="nextBtn" onclick="changeVerse(1)" class="px-3.5 py-1.5 text-xs sm:text-sm font-semibold text-sky-800 bg-sky-50 hover:bg-sky-100 rounded-lg transition disabled:opacity-30 disabled:cursor-not-allowed">下一段</button>
                    </div>
                </div>

                <!-- 經文卡片 (淺藍色框) -->
                <div id="scriptureText" class="text-sky-950 font-bold bg-sky-50/80 p-5 rounded-xl mb-6 border-l-4 border-sky-600 shadow-sm leading-relaxed transition-all"></div>

                <!-- 隨筆分享內容 -->
                <div id="reflectionText" class="text-gray-800 leading-relaxed text-justify transition-all"></div>

                <!-- 底部朗讀控制 -->
                <div class="mt-8 pt-4 border-t border-sky-100 flex flex-wrap items-center justify-between gap-3 bg-sky-50/40 p-4 rounded-xl">
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-sky-900 font-semibold tracking-wide">廣東話朗讀</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="playBtn" onclick="toggleSpeech()" class="bg-sky-600 hover:bg-sky-700 text-white px-4 py-2 rounded-xl text-sm font-medium shadow-sm transition flex items-center gap-1.5">
                            <svg id="playIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <span id="playText">聆聽整段</span>
                        </button>
                        <button onclick="stopSpeech()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-2 rounded-xl text-sm font-medium transition">停止</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 右下角版本編號 -->
    <footer class="w-full text-right px-4 mt-6">
        <span class="text-[10px] text-gray-400 font-mono tracking-tighter select-none">v1.2.1</span>
    </footer>

    <!-- JavaScript 解析器與邏輯 -->
    <script>
        let dbEntries = [];
        let currentIndex = 0;
        let fontSizeLevel = parseInt(localStorage.getItem('fontSizeLevel_proverbs')) || 2;
        
        const fontScaleConfigs = [
            { scripture: 'text-base sm:text-lg', reflection: 'text-sm sm:text-base' },
            { scripture: 'text-lg sm:text-xl', reflection: 'text-base sm:text-lg' },
            { scripture: 'text-xl sm:text-2xl', reflection: 'text-lg sm:text-xl' },
            { scripture: 'text-2xl sm:text-3xl', reflection: 'text-xl sm:text-2xl' }
        ];

        let synth = window.speechSynthesis;
        let speechQueue = [];
        let isPlaying = false;

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('箴言隨筆.txt');
                if (!response.ok) throw new Error('無法讀取資料庫檔案');
                const rawText = await response.text();
                parseDatabase(rawText);
            } catch (error) {
                console.error(error);
                document.getElementById('loadingIndicator').innerHTML = `
                    <p class="text-red-500 font-medium">無法自動載入「箴言隨筆.txt」檔案。</p>
                    <p class="text-xs text-gray-500 mt-2">請確保「箴言隨筆.txt」與網頁放在同一個目錄下。</p>
                `;
            }
        });

        function parseDatabase(text) {
            const sections = text.split(/\n(?=\d+[）\)]\s*)/);
            dbEntries = [];

            sections.forEach(sec => {
                const trimmed = sec.trim();
                if (!trimmed) return;

                const lines = trimmed.split('\n');
                const firstLine = lines[0].trim();
                const numMatch = firstLine.match(/^(\d+)[）)]/);
                if (!numMatch) return;
                const entryNum = numMatch[1];

                const fullBody = lines.slice(1).join('\n');

                let refMatch = fullBody.match(/[（—–-]\s*(箴言\s*\d+:\d+(?:-\d+)?)\s*[）)]?/);
                let verseRef = refMatch ? refMatch[1] : `箴言 (第${entryNum}篇)`;
                
                let displayTitle = `${entryNum}) ${verseRef}`;

                let scripturePart = "";
                let reflectionPart = "";

                const shareIndex = fullBody.indexOf('【分享】');
                if (shareIndex !== -1) {
                    scripturePart = fullBody.substring(0, shareIndex).trim();
                    let refText = fullBody.substring(shareIndex + 4).trim();
                    refText = refText.replace(/[●•]\s*$/, '').trim();
                    reflectionPart = refText;
                } else {
                    scripturePart = fullBody;
                    reflectionPart = "";
                }

                dbEntries.push({
                    number: entryNum,
                    verseRef: verseRef,
                    title: displayTitle,
                    scripture: scripturePart,
                    reflection: reflectionPart
                });
            });

            if (dbEntries.length > 0) {
                populateSelector();
                
                let savedIndex = parseInt(localStorage.getItem('lastReadIndex_proverbs'));
                if (isNaN(savedIndex) || savedIndex < 0 || savedIndex >= dbEntries.length) {
                    savedIndex = 0;
                }
                
                displayEntry(savedIndex);
                document.getElementById('loadingIndicator').classList.add('hidden');
                document.getElementById('contentContainer').classList.remove('hidden');
            } else {
                document.getElementById('loadingIndicator').innerHTML = `<p class="text-red-500">解析檔案失敗，未找到有效內容。</p>`;
            }
        }

        function populateSelector() {
            const select = document.getElementById('verseSelect');
            select.innerHTML = '';
            dbEntries.forEach((entry, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = entry.title;
                option.className = "font-semibold";
                select.appendChild(option);
            });

            select.addEventListener('change', (e) => {
                stopSpeech();
                currentIndex = parseInt(e.target.value);
                displayEntry(currentIndex);
            });
        }

        function displayEntry(index) {
            currentIndex = index;
            localStorage.setItem('lastReadIndex_proverbs', currentIndex);

            document.getElementById('verseSelect').value = index;
            document.getElementById('verseTitle').textContent = dbEntries[index].title;

            const entry = dbEntries[index];
            const cleanScripture = entry.scripture.replace(/\*/g, '');
            
            const currentConfig = fontScaleConfigs[fontSizeLevel];
            
            const scriptureEl = document.getElementById('scriptureText');
            scriptureEl.className = `text-sky-950 font-bold bg-sky-50/80 p-5 rounded-xl mb-6 border-l-4 border-sky-600 shadow-sm leading-relaxed transition-all ${currentConfig.scripture}`;
            scriptureEl.innerHTML = formatParagraphs(cleanScripture);

            const reflectionEl = document.getElementById('reflectionText');
            reflectionEl.className = `text-gray-800 leading-relaxed text-justify transition-all ${currentConfig.reflection}`;
            reflectionEl.innerHTML = formatParagraphs(entry.reflection);

            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === dbEntries.length - 1;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function changeFontSize(direction) {
            fontSizeLevel += direction;
            if (fontSizeLevel < 0) fontSizeLevel = 0;
            if (fontSizeLevel >= fontScaleConfigs.length) fontSizeLevel = fontScaleConfigs.length - 1;
            
            localStorage.setItem('fontSizeLevel_proverbs', fontSizeLevel);
            displayEntry(currentIndex);
        }

        function formatParagraphs(text) {
            const paragraphs = text.split(/\n\s*\n/);
            return paragraphs
                .map(p => {
                    const cleanP = p.trim().replace(/\n/g, '<br>');
                    return cleanP ? `<p class="paragraph-block">${cleanP}</p>` : '';
                })
                .join('');
        }

        function changeVerse(direction) {
            stopSpeech();
            const newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < dbEntries.length) {
                displayEntry(newIndex);
            }
        }

        // 修正朗讀標題：自動過濾掉前面的文章編號（如 354)），直接從「箴言」開始正確讀出章節
        function formatTitleForSpeech(title) {
            const clean = title.replace(/^\d+[）\)]\s*/, '').trim();
            const match = clean.match(/^箴言\s*(\d+):(\d+)(?:-(\d+))?$/);
            if (match) {
                const ch = match[1];
                const startV = match[2];
                const endV = match[3];
                if (endV) {
                    return `箴言第${ch}章第${startV}至第${endV}節`;
                } else {
                    return `箴言第${ch}章第${startV}節`;
                }
            }
            return clean.replace('箴言', '箴言第').replace(':', '章第') + '節';
        }

        function toggleSpeech() {
            if (isPlaying) {
                stopSpeech();
                return;
            }

            stopSpeech();

            const entry = dbEntries[currentIndex];
            const spokenTitle = formatTitleForSpeech(entry.title);
            
            const fullText = `${spokenTitle}。${entry.scripture}。${entry.reflection}`
                .replace(/\*/g, '')
                .replace(/<[^>]*>/g, '');

            speechQueue = fullText.match(/[^。！？\n]+[。！？\n]*/g) || [fullText];

            isPlaying = true;
            document.getElementById('playText').textContent = '停止朗讀';
            playNextChunk();
        }

        function playNextChunk() {
            if (!isPlaying) return;

            if (speechQueue.length === 0) {
                stopSpeech();
                return;
            }

            const chunk = speechQueue.shift();
            const utterance = new SpeechSynthesisUtterance(chunk);
            utterance.lang = 'zh-HK';
            utterance.rate = 1.0;

            const voices = synth.getVoices();
            const hkVoice = voices.find(v => v.lang === 'zh-HK' && (v.name.includes('Sin-ji') || v.name.includes('HiuMaan') || v.name.includes('Female') || v.name.includes('女')));
            if (hkVoice) {
                utterance.voice = hkVoice;
            }

            utterance.onend = () => {
                playNextChunk();
            };

            utterance.onerror = () => {
                stopSpeech();
            };

            synth.speak(utterance);
        }

        function stopSpeech() {
            isPlaying = false;
            speechQueue = [];
            if (synth) {
                synth.cancel();
            }
            const playTextEl = document.getElementById('playText');
            if (playTextEl) {
                playTextEl.textContent = '聆聽整段';
            }
        }
    </script>
</body>
</html>
