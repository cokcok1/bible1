<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>週五隨筆</title>
  
  <!-- App Icon 設定 -->
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  
  <style>
    :root {
      /* 淺藍色主題配色 */
      --primary-blue: #3b82f6;
      --primary-light: #e0f2fe;
      --primary-border: #bae6fd;
      --primary-dark: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #475569;
      --quote-bg: #f0f9ff;
      --quote-border: #0284c7;
      --btn-bg: #f0f9ff;
      --btn-text: #0369a1;
      --btn-hover: #e0f2fe;
      --base-font-size: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Meiryo", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      font-size: var(--base-font-size);
    }

    /* 頂部固定區域 */
    .header-container {
      width: 100%;
      max-width: 500px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .app-title {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 4px;
    }

    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    /* 下拉選單 */
    .chapter-select {
      flex: 1;
      padding: 8px 12px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #0369a1;
      background-color: var(--primary-light);
      border: 1px solid var(--primary-border);
      border-radius: 12px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230369a1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 16px;
      padding-right: 32px;
    }

    /* 字體控制與朗讀按鈕群組 */
    .font-controls {
      display: flex;
      align-items: center;
      background-color: var(--primary-light);
      border: 1px solid var(--primary-border);
      border-radius: 12px;
      padding: 2px 6px;
      gap: 2px;
    }

    .font-label {
      font-size: 0.8rem;
      color: #0369a1;
      font-weight: 600;
      margin-right: 2px;
      padding-left: 4px;
    }

    .btn-small {
      background: #ffffff;
      border: 1px solid var(--primary-border);
      color: #0369a1;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-small:active {
      background-color: var(--btn-hover);
    }

    /* 主卡片區域 */
    .card {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      border: 1px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      margin-bottom: 30px;
    }

    /* 卡片頂部導覽 (章節標籤 + 上/下一段) */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chapter-tag {
      background-color: var(--primary-light);
      color: #0369a1;
      font-weight: 800;
      font-size: 1.15rem;
      padding: 6px 14px;
      border-radius: 10px;
      letter-spacing: 0.5px;
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-nav {
      background-color: #f1f5f9;
      border: none;
      color: var(--text-sub);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-nav:active {
      background-color: var(--primary-light);
      color: #0369a1;
    }

    /* 經文引言區塊 */
    .quote-box {
      background-color: var(--quote-bg);
      border-left: 5px solid var(--quote-border);
      border-radius: 0 14px 14px 0;
      padding: 16px 18px;
      font-weight: 700;
      line-height: 1.6;
      color: #0f172a;
      font-size: 1.05em;
    }

    /* 心得正文區塊 */
    .content-box {
      color: var(--text-main);
      line-height: 1.75;
      font-weight: 400;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .content-box p {
      word-break: break-word;
    }

    /* 朗讀控制底欄 */
    .audio-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--quote-bg);
      border: 1px solid var(--primary-border);
      padding: 8px 14px;
      border-radius: 12px;
      margin-top: 8px;
    }

    .audio-btn {
      background-color: var(--primary-blue);
      color: white;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
    }

    .audio-status {
      font-size: 0.85rem;
      color: #0369a1;
      font-weight: 600;
    }

    /* 右下角版本號 (極淺色) */
    .version-tag {
      position: fixed;
      bottom: 6px;
      right: 10px;
      font-size: 0.7rem;
      color: #cbd5e1; /* 非常淺的灰色/藍灰色 */
      font-family: monospace;
      user-select: none;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="header-container">
    <!-- 頂部標題 -->
    <div class="app-title">
      🌿 週五隨筆 · 傳道書
    </div>

    <!-- 控制列：下拉選單 + 字體縮放 -->
    <div class="top-controls">
      <select id="chapterSelect" class="chapter-select" onchange="changeChapter(this.value)">
        <!-- 由 JavaScript 動態生成選項 -->
      </select>

      <div class="font-controls">
        <span class="font-label">字體</span>
        <button class="btn-small" onclick="adjustFontSize(-1)">A-</button>
        <button class="btn-small" onclick="adjustFontSize(1)">A+</button>
      </div>
    </div>
  </div>

  <!-- 主要文章卡片 -->
  <div class="card">
    <div class="card-header">
      <div class="chapter-tag" id="displayChapterTag">傳2:15-17</div>
      <div class="nav-buttons">
        <button class="btn-nav" onclick="prevChapter()">上一段</button>
        <button class="btn-nav" onclick="nextChapter()">下一段</button>
      </div>
    </div>

    <!-- 經文區塊 -->
    <div class="quote-box" id="displayQuote">
      <!-- 經文內容 -->
    </div>

    <!-- 心得正文區塊 -->
    <div class="content-box" id="displayContent">
      <!-- 心得內容 -->
    </div>

    <!-- Siri 風格朗讀控制列 -->
    <div class="audio-bar">
      <div class="audio-status" id="speechStatus">🔊 語音朗讀</div>
      <button class="audio-btn" id="playBtn" onclick="toggleSpeech()">▶</button>
    </div>
  </div>

  <!-- 右下角極淺色版本號 -->
  <div class="version-tag">v1.0.0</div>

  <script>
    // 文章資料庫（可自行擴充/替換內容）
    const articles = [
      {
        id: "傳2:15-17",
        tag: "傳2:15-17",
        quote: "我心裡說：「臨到愚昧人身上的，也必臨到我身上；那麼，我為什麼要更有智慧呢？」於是我心裡說：「這也是虛空。」",
        content: [
          "因為智慧人和愚昧人一樣，沒有人永遠紀念他們，在未來的日子裡，都會被人遺忘。可歎智慧人跟愚昧人一樣，終必死亡。",
          "因此我恨惡生命，因為在日光之下所發生的事，都使我厭煩。一切都是虛空，都是捕風。"
        ]
      },
      {
        id: "傳3:1-4",
        tag: "傳3:1-4",
        quote: "凡事都有定期，天下萬物都有定時。生有時，死有時；栽種有時，拔出所栽種的也有時。",
        content: [
          "殺戮有時，醫治有時；拆毀有時，建造有時；哭有時，笑有時；哀慟有時，跳舞有時。",
          "人生中的每個階段與際遇都有神的定時與美意，學會順應與珍惜當下，便能體會生命的安息與智慧。"
        ]
      },
      {
        id: "傳4:9-10",
        tag: "傳4:9-10",
        quote: "兩個人總比一個人好，因為二人勞碌同得美好的果效。若是跌倒，一人分能扶起他的同伴。",
        content: [
          "若孤身一人跌倒，沒有別人扶起他，這人就有禍了！夥伴之間的相扶相持，能讓人在困境中獲得溫暖與重新站立的力量。"
        ]
      }
    ];

    let currentIndex = 0;
    let currentFontSize = 18; // 預設字體大小
    let synth = window.speechSynthesis;
    let utterance = null;
    let isSpeaking = false;

    // 初始化頁面
    window.onload = function() {
      initDropdown();
      renderArticle(0);
    };

    // 初始化下拉選單
    function initDropdown() {
      const select = document.getElementById('chapterSelect');
      select.innerHTML = '';
      articles.forEach((item, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = item.tag;
        select.appendChild(option);
      });
    }

    // 渲染文章內容
    function renderArticle(index) {
      stopSpeech(); // 切換文章時停止朗讀

      currentIndex = index;
      const item = articles[currentIndex];

      document.getElementById('chapterSelect').value = currentIndex;
      document.getElementById('displayChapterTag').textContent = item.tag;
      document.getElementById('displayQuote').textContent = item.quote;

      const contentBox = document.getElementById('displayContent');
      contentBox.innerHTML = '';
      item.content.forEach(paragraph => {
        const p = document.createElement('p');
        p.textContent = paragraph;
        contentBox.appendChild(p);
      });
    }

    // 切換章節
    function changeChapter(index) {
      renderArticle(parseInt(index));
    }

    function prevChapter() {
      if (currentIndex > 0) {
        renderArticle(currentIndex - 1);
      }
    }

    function nextChapter() {
      if (currentIndex < articles.length - 1) {
        renderArticle(currentIndex + 1);
      }
    }

    // 字體大小調整
    function adjustFontSize(delta) {
      currentFontSize += delta * 2;
      // 限制字體範圍 14px - 26px
      if (currentFontSize < 14) currentFontSize = 14;
      if (currentFontSize > 26) currentFontSize = 26;

      document.body.style.setProperty('--base-font-size', currentFontSize + 'px');
    }

    // Siri 風格語音朗讀 (TTS)
    function toggleSpeech() {
      if (isSpeaking) {
        stopSpeech();
      } else {
        startSpeech();
      }
    }

    function startSpeech() {
      if (!synth) {
        alert('您的瀏覽器不支援語音朗讀功能。');
        return;
      }

      const item = articles[currentIndex];
      const fullText = item.quote + "。" + item.content.join(" ");

      utterance = new SpeechSynthesisUtterance(fullText);
      utterance.rate = 0.95; // 接近自然說話語速
      utterance.pitch = 1.0;

      // 優先尋找 iOS/macOS 的 Cantonese (廣東話) 或 Mandarin (中文) Siri 語音
      const voices = synth.getVoices();
      let selectedVoice = voices.find(v => v.lang.includes('zh-HK') || v.lang.includes('yue')) 
                       || voices.find(v => v.lang.includes('zh-TW'))
                       || voices.find(v => v.lang.includes('zh'));

      if (selectedVoice) {
        utterance.voice = selectedVoice;
      }

      utterance.onstart = function() {
        isSpeaking = true;
        document.getElementById('playBtn').textContent = '❚❚';
        document.getElementById('speechStatus').textContent = '🎙️ 朗讀中...';
      };

      utterance.onend = function() {
        stopSpeech();
      };

      utterance.onerror = function() {
        stopSpeech();
      };

      synth.speak(utterance);
    }

    function stopSpeech() {
      if (synth && synth.speaking) {
        synth.cancel();
      }
      isSpeaking = false;
      const playBtn = document.getElementById('playBtn');
      const speechStatus = document.getElementById('speechStatus');
      if (playBtn) playBtn.textContent = '▶';
      if (speechStatus) speechStatus.textContent = '🔊 語音朗讀';
    }
  </script>
</body>
</html>
